name: Quality & Sanity Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Basic Tree & Syntax Audit
        run: |
          echo "Auditing repository integrity at $(date -u)"
          git status --short
