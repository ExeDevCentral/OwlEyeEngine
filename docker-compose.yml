services:
  owleye:
    build: .
    container_name: owleye_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /proc:/proc:ro
    environment:
      - OWLEYE_PORT=8000
      - OWLEYE_DEMO_MODE=${OWLEYE_DEMO_MODE:-false}
      - SENTRY_TELEGRAM_TOKEN=${SENTRY_TELEGRAM_TOKEN:-}
      - SENTRY_TELEGRAM_CHAT_ID=${SENTRY_TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  owleye-demo:
    build: .
    container_name: owleye_demo
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - OWLEYE_PORT=8000
      - OWLEYE_DEMO_MODE=true
    profiles:
      - demo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
